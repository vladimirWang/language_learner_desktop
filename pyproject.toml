[project]
name = "language-learner-desktop-sidecar"
version = "0.1.0"
description = "desktop 侧车：faster-whisper 解析 + 打包上传"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.1",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "yt-dlp>=2025.1.26",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
